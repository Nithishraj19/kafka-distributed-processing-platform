apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-processing-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kafka-processing-worker
  template:
    metadata:
      labels:
        app: kafka-processing-worker
    spec:
      containers:
        - name: worker
          image: kafka-processing-worker:1.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_TOPIC
              value: events
            - name: KAFKA_GROUP_ID
              value: processing-workers
